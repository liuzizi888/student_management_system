<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试用户信息</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .result {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>用户信息测试页面</h1>

    <div class="test-section">
        <h2>1. 检查 localStorage</h2>
        <button onclick="checkLocalStorage()">检查 localStorage</button>
        <div class="result" id="localStorageResult">点击按钮检查...</div>
    </div>

    <div class="test-section">
        <h2>2. 检查 API</h2>
        <button onclick="testUserInfoAPI()">调用 userinfo API</button>
        <div class="result" id="apiResult">点击按钮调用API...</div>
    </div>

    <div class="test-section">
        <h2>3. 测试 loadUserInfo</h2>
        <button onclick="testLoadUserInfo()">调用 loadUserInfo</button>
        <div class="result" id="loadUserInfoResult">点击按钮测试...</div>
    </div>

    <div class="test-section">
        <h2>4. 清空测试</h2>
        <button onclick="clearLocalStorage()">清空 localStorage</button>
        <div class="result" id="clearResult">点击按钮清空...</div>
    </div>

    <div class="test-section">
        <h2>导航</h2>
        <a href="/frontend/index.html">返回首页</a> |
        <a href="/frontend/login.html">去登录</a>
    </div>

    <script>
        function checkLocalStorage() {
            console.log('检查 localStorage');
            const resultDiv = document.getElementById('localStorageResult');
            try {
                const userInfo = localStorage.getItem('userInfo');
                resultDiv.innerHTML = '<strong>userInfo:</strong><br>' + JSON.stringify(userInfo, null, 2);
                if (userInfo) {
                    const parsed = JSON.parse(userInfo);
                    resultDiv.innerHTML += '<br><br><strong>解析后:</strong><br>' + JSON.stringify(parsed, null, 2);
                }
            } catch (e) {
                resultDiv.innerHTML = '<strong>错误:</strong> ' + e.message;
            }
        }

        async function testUserInfoAPI() {
            console.log('测试 userinfo API');
            const resultDiv = document.getElementById('apiResult');
            try {
                const response = await fetch('/operate/userinfo', { credentials: 'include' });
                const data = await response.json();
                resultDiv.innerHTML = '<strong>API 返回:</strong><br>' + JSON.stringify(data, null, 2);
            } catch (e) {
                resultDiv.innerHTML = '<strong>错误:</strong> ' + e.message;
            }
        }

        function testLoadUserInfo() {
            console.log('测试 loadUserInfo');
            const resultDiv = document.getElementById('loadUserInfoResult');
            
            // 复制一个简化版本测试
            async function testLoadUserInfo_() {
                try {
                    resultDiv.innerHTML = '正在执行...';
                    let userInfo = localStorage.getItem('userInfo');
                    resultDiv.innerHTML += '<br>1. localStorage 中有: ' + (userInfo ? '有' : '无');
                    
                    if (!userInfo) {
                        resultDiv.innerHTML += '<br>2. 尝试从服务器获取...';
                        const response = await fetch('/operate/userinfo', { credentials: 'include' });
                        const data = await response.json();
                        resultDiv.innerHTML += '<br>3. 服务器返回: ' + JSON.stringify(data);
                        if (data.code === 200) {
                            userInfo = JSON.stringify(data.data);
                            localStorage.setItem('userInfo', userInfo);
                        }
                    }
                    
                    if (userInfo) {
                        const user = JSON.parse(userInfo);
                        resultDiv.innerHTML += '<br>4. 用户信息: ' + JSON.stringify(user);
                        let roleDisplay = user.role_name;
                        if (user.role === 'admin' || user.role_name === 'admin') {
                            roleDisplay = '管理员';
                        } else {
                            roleDisplay = '普通员工';
                        }
                        resultDiv.innerHTML += '<br>5. 显示身份: ' + roleDisplay;
                    }
                    resultDiv.innerHTML += '<br><br><strong>完成!</strong>';
                } catch (e) {
                    resultDiv.innerHTML += '<br><strong>错误:</strong> ' + e.message;
                }
            }
            
            testLoadUserInfo_();
        }

        function clearLocalStorage() {
            localStorage.clear();
            document.getElementById('clearResult').innerHTML = 'localStorage 已清空';
        }
    </script>
</body>
</html>
