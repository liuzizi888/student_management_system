<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统 - 首页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>学生管理系统</h1>
        <div class="header-right">
            <span>欢迎使用</span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a href="index.html" class="active"><span class="nav-icon">🏠</span>首页</a></li>
            <li><a href="student.html"><span class="nav-icon">👨‍🎓</span>学生管理</a></li>
            <li><a href="teacher.html"><span class="nav-icon">👨‍🏫</span>教师管理</a></li>
            <li><a href="class.html"><span class="nav-icon">📚</span>班级管理</a></li>
            <li><a href="score.html"><span class="nav-icon">📝</span>成绩管理</a></li>
            <li><a href="employment.html"><span class="nav-icon">💼</span>就业管理</a></li>
            <li><a href="consultant.html"><span class="nav-icon">👔</span>顾问管理</a></li>
            <li><a href="department.html"><span class="nav-icon">🏢</span>部门管理</a></li>
            <li><a href="analysis.html"><span class="nav-icon">📊</span>统计分析</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">系统概览</h2>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 24px; border-radius: 8px; color: white; text-align: center;">
                    <div style="font-size: 36px; font-weight: bold; margin-bottom: 8px;" id="studentCount">-</div>
                    <div style="font-size: 14px; opacity: 0.9;">学生总数</div>
                </div>
                <div style="background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); padding: 24px; border-radius: 8px; color: white; text-align: center;">
                    <div style="font-size: 36px; font-weight: bold; margin-bottom: 8px;" id="teacherCount">-</div>
                    <div style="font-size: 14px; opacity: 0.9;">教师总数</div>
                </div>
                <div style="background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%); padding: 24px; border-radius: 8px; color: white; text-align: center;">
                    <div style="font-size: 36px; font-weight: bold; margin-bottom: 8px;" id="classCount">-</div>
                    <div style="font-size: 14px; opacity: 0.9;">班级总数</div>
                </div>
                <div style="background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%); padding: 24px; border-radius: 8px; color: white; text-align: center;">
                    <div style="font-size: 36px; font-weight: bold; margin-bottom: 8px;" id="employmentCount">-</div>
                    <div style="font-size: 14px; opacity: 0.9;">就业人数</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">快速操作</h2>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px;">
                <button class="btn btn-primary" onclick="window.location.href='student.html'">添加学生</button>
                <button class="btn btn-success" onclick="window.location.href='teacher.html'">添加教师</button>
                <button class="btn btn-warning" onclick="window.location.href='class.html'">添加班级</button>
                <button class="btn btn-danger" onclick="window.location.href='score.html'">录入成绩</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">最新学生</h2>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>学生编号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>班级</th>
                    </tr>
                </thead>
                <tbody id="recentStudents">
                    <tr><td colspan="4" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        // 临时调试函数
        window.manualUpdate = async function() {
            console.log('=== 手动更新用户信息 ===');
            try {
                // 1. 检查 localStorage
                const userInfo = localStorage.getItem('userInfo');
                console.log('localStorage 中的 userInfo:', userInfo);
                
                // 2. 如果没有，去 API 获取
                if (!userInfo) {
                    const response = await fetch('/operate/userinfo', { credentials: 'include' });
                    const data = await response.json();
                    console.log('API 返回:', data);
                    if (data.code === 200) {
                        localStorage.setItem('userInfo', JSON.stringify(data.data));
                    }
                }
                
                // 3. 查找 span 元素
                const headerRightSpan = document.querySelector('.header-right span');
                console.log('找到的 span 元素:', headerRightSpan);
                
                if (headerRightSpan && localStorage.getItem('userInfo')) {
                    const user = JSON.parse(localStorage.getItem('userInfo'));
                    console.log('用户信息:', user);
                    
                    let roleDisplay = '普通員工';
                    if (user.role === 'admin' || user.role_name === 'admin' || user.role_name === '管理员') {
                        roleDisplay = '管理员';
                    } else if (user.role_name && user.role_name !== 'employee') {
                        roleDisplay = user.role_name;
                    } else if (user.role === 'employee') {
                        roleDisplay = '普通員工';
                    }
                    
                    headerRightSpan.textContent = `欢迎使用，${roleDisplay}`;
                    console.log('更新成功！显示:', roleDisplay);
                    alert(`更新成功！\n用户信息: ${JSON.stringify(user)}\n显示: 欢迎使用，${roleDisplay}`);
                } else {
                    alert(`更新失败！\nspan 元素: ${!!headerRightSpan}\nuserInfo: ${!!localStorage.getItem('userInfo')}`);
                }
            } catch (e) {
                console.error('错误:', e);
                alert('错误: ' + e.message);
            }
        };

        async function loadStats() {
            try {
                const [studentRes, teacherRes, classRes, employmentRes] = await Promise.all([
                    request('/student/students?key=姓名&value='),
                    request('/teacher/check_teacher'),
                    request('/class_info/get_class_all'),
                    request('/employment/pageshow?page=1&size=1')
                ]);
                
                const studentCount = studentRes.data.data?.length || 0;
                const teacherCount = teacherRes.data.data?.length || 0;
                const classCount = classRes.data.data?.length || 0;
                const employmentCount = employmentRes.data.data?.length || 0;
                
                document.getElementById('studentCount').textContent = studentCount;
                document.getElementById('teacherCount').textContent = teacherCount;
                document.getElementById('classCount').textContent = classCount;
                document.getElementById('employmentCount').textContent = employmentCount;
            } catch (error) {
                console.error('Load stats error:', error);
            }
        }

        async function loadRecentStudents() {
            try {
                const response = await request('/student/students?key=姓名&value=');
                const students = response.data.data || [];
                const recent = students.slice(0, 5);
                
                const tbody = document.getElementById('recentStudents');
                if (recent.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">暂无学生数据</td></tr>';
                    return;
                }
                
                tbody.innerHTML = recent.map(s => `
                    <tr>
                        <td>${s.student_id || '-'}</td>
                        <td>${s.name || '-'}</td>
                        <td>${s.gender || '-'}</td>
                        <td>${s.class_name || '-'}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Load recent students error:', error);
                document.getElementById('recentStudents').innerHTML = '<tr><td colspan="4" class="empty-state">加载失败</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('=== 页面加载完成 ===');
            // 在快速操作区域添加一个测试按钮
            const quickActions = document.querySelectorAll('.card')[1];
            if (quickActions) {
                const testBtn = document.createElement('button');
                testBtn.className = 'btn';
                testBtn.style.background = '#ff9800';
                testBtn.textContent = '手动更新用户信息';
                testBtn.onclick = window.manualUpdate;
                quickActions.querySelector('.card-header').appendChild(testBtn);
            }
            
            loadUserInfo();
            loadStats();
            loadRecentStudents();
        });
    </script>
</body>
</html>
