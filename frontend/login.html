<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统 - 登录</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>学生管理系统</h2>
            <p>请登录您的账号</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 清除旧的用户信息
            localStorage.removeItem('userInfo');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                
                const response = await fetch('/operate/login', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.code === 200) {
                    console.log('登录成功，正在获取用户信息...');
                    // 登录成功后获取用户信息
                    try {
                        const userResponse = await fetch('/operate/userinfo', {
                            credentials: 'include'
                        });
                        const userData = await userResponse.json();
                        console.log('用户信息接口返回:', userData);
                        if (userData.code === 200) {
                            // 保存用户信息到 localStorage
                            localStorage.setItem('userInfo', JSON.stringify(userData.data));
                            console.log('用户信息已保存');
                        }
                    } catch (e) {
                        console.error('获取用户信息失败', e);
                    }
                    window.location.href = '/frontend/index.html';
                } else {
                    alert(data.msg || '登录失败');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('登录失败，请稍后重试');
            }
        });
    </script>
</body>
</html>
