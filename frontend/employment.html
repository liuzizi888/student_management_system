<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统 - 就业管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>学生管理系统</h1>
        <div class="header-right">
            <span>欢迎使用</span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a href="index.html"><span class="nav-icon">🏠</span>首页</a></li>
            <li><a href="student.html"><span class="nav-icon">👨‍🎓</span>学生管理</a></li>
            <li><a href="teacher.html"><span class="nav-icon">👨‍🏫</span>教师管理</a></li>
            <li><a href="class.html"><span class="nav-icon">📚</span>班级管理</a></li>
            <li><a href="score.html"><span class="nav-icon">📝</span>成绩管理</a></li>
            <li><a href="employment.html" class="active"><span class="nav-icon">💼</span>就业管理</a></li>
            <li><a href="consultant.html"><span class="nav-icon">👔</span>顾问管理</a></li>
            <li><a href="department.html"><span class="nav-icon">🏢</span>部门管理</a></li>
            <li><a href="analysis.html"><span class="nav-icon">📊</span>统计分析</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">就业信息列表</h2>
                <button class="btn btn-primary" onclick="openModal('addModal')">添加就业信息</button>
            </div>

            <div class="search-bar">
                <select id="searchKey" class="form-control" style="max-width: 120px;">
                    <option value="全部">全部</option>
                    <option value="学生编号">学生编号</option>
                    <option value="就业公司">就业公司</option>
                    <option value="工资">工资</option>
                </select>
                <input type="text" id="searchValue" class="form-control" placeholder="搜索关键词">
                <button class="btn btn-primary" onclick="searchEmployment()">搜索</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>学生编号</th>
                        <th>学生姓名</th>
                        <th>班级编号</th>
                        <th>就业公司</th>
                        <th>薪资</th>
                        <th>就业时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="employmentTable">
                    <tr><td colspan="8" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>

            <div class="pagination">
                <div class="pagination-info">
                    共 <span id="totalRecords">0</span> 条记录，当前第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
                </div>
                <div class="pagination-controls">
                    <button class="btn btn-sm" id="prevPage" onclick="prevPage()">上一页</button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="btn btn-sm" id="nextPage" onclick="nextPage()">下一页</button>
                    <div class="page-jump">
                        跳至 <input type="number" id="jumpPage" class="form-control" min="1" value="1" onkeypress="if(event.key==='Enter') jumpToPage()"> 页
                        <button class="btn btn-sm btn-primary" onclick="jumpToPage()">跳转</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">添加就业信息</h3>
                <button class="modal-close" onclick="closeModal('addModal'); clearForm('addForm')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>学生编号</label>
                            <input type="number" name="student_id" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>学生姓名</label>
                            <input type="text" name="student_name" class="form-control" required maxlength="20">
                        </div>
                        <div class="form-group">
                            <label>班级编号</label>
                            <input type="number" name="class_id" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>就业公司</label>
                            <input type="text" name="company" class="form-control" required maxlength="50">
                        </div>
                        <div class="form-group">
                            <label>薪资</label>
                            <input type="number" name="salary" class="form-control" required step="0.01">
                        </div>
                        <div class="form-group">
                            <label>就业时间</label>
                            <input type="date" name="offer_time" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('addModal'); clearForm('addForm')">取消</button>
                <button class="btn btn-primary" onclick="addEmployment()">确定</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">修改就业信息</h3>
                <button class="modal-close" onclick="closeModal('editModal'); clearForm('editForm')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" name="employment_id">
                    <div class="form-row">
                        <div class="form-group">
                            <label>学生编号</label>
                            <input type="number" name="student_id" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>学生姓名</label>
                            <input type="text" name="student_name" class="form-control" required maxlength="20">
                        </div>
                        <div class="form-group">
                            <label>班级编号</label>
                            <input type="number" name="class_id" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>就业公司</label>
                            <input type="text" name="company" class="form-control" required maxlength="50">
                        </div>
                        <div class="form-group">
                            <label>薪资</label>
                            <input type="number" name="salary" class="form-control" required step="0.01">
                        </div>
                        <div class="form-group">
                            <label>就业时间</label>
                            <input type="date" name="offer_time" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('editModal'); clearForm('editForm')">取消</button>
                <button class="btn btn-primary" onclick="updateEmployment()">确定</button>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        let currentEditId = null;
        let paginationData = {
            pageSize: 10,
            pageNum: 1,
            total: 0,
            data: []
        };

        async function loadEmployments(pageNum = 1) {
            const pageSize = 10;
            paginationData.pageSize = pageSize;
            paginationData.pageNum = pageNum;

            try {
                const url = `/employment/page?key=${encodeURIComponent('全部')}&page=${pageNum}&size=${pageSize}`;
                console.log('请求URL:', url);
                const response = await fetch(url, { credentials: 'include' });
                const result = await response.json();
                console.log('分页查询响应:', result);
                const employments = result.data || [];
                console.log('就业数据:', employments);
                paginationData.total = employments.length;
                paginationData.data = employments;
                renderEmployments(employments);
                updatePagination();
            } catch (error) {
                console.error('Load employments error:', error);
                document.getElementById('employmentTable').innerHTML = '<tr><td colspan="8" class="empty-state">加载失败: ' + error.message + '</td></tr>';
            }
        }

        function updatePagination() {
            const totalPages = Math.max(1, Math.ceil(paginationData.total / paginationData.pageSize) || 1);
            
            document.getElementById('totalRecords').textContent = paginationData.total;
            document.getElementById('currentPage').textContent = paginationData.pageNum;
            document.getElementById('totalPages').textContent = totalPages;
            document.getElementById('jumpPage').max = totalPages;
            document.getElementById('jumpPage').value = paginationData.pageNum;

            document.getElementById('prevPage').disabled = paginationData.pageNum <= 1;
            document.getElementById('nextPage').disabled = paginationData.pageNum >= totalPages;

            renderPageNumbers(totalPages);
        }

        function renderPageNumbers(totalPages) {
            const container = document.getElementById('pageNumbers');
            const current = paginationData.pageNum;
            let html = '';

            const maxVisible = 5;
            let start = Math.max(1, current - Math.floor(maxVisible / 2));
            let end = Math.min(totalPages, start + maxVisible - 1);

            if (end - start < maxVisible - 1) {
                start = Math.max(1, end - maxVisible + 1);
            }

            if (start > 1) {
                html += `<button class="btn btn-sm page-num" onclick="goToPage(1)">1</button>`;
                if (start > 2) {
                    html += `<span class="page-ellipsis">...</span>`;
                }
            }

            for (let i = start; i <= end; i++) {
                const active = i === current ? 'active' : '';
                html += `<button class="btn btn-sm page-num ${active}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (end < totalPages) {
                if (end < totalPages - 1) {
                    html += `<span class="page-ellipsis">...</span>`;
                }
                html += `<button class="btn btn-sm page-num" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            container.innerHTML = html;
        }

        function goToPage(pageNum) {
            const totalPages = Math.max(1, Math.ceil(paginationData.total / paginationData.pageSize) || 1);
            pageNum = Math.max(1, Math.min(pageNum, totalPages));
            loadEmployments(pageNum);
        }

        function renderEmployments(employments) {
            const tbody = document.getElementById('employmentTable');
            if (!employments || employments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无就业数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = employments.map(e => `
                <tr>
                    <td>${e.employment_id || '-'}</td>
                    <td>${e.student_id || '-'}</td>
                    <td>${e.student_name || '-'}</td>
                    <td>${e.class_id || '-'}</td>
                    <td>${e.company || '-'}</td>
                    <td>${e.salary != null ? '¥' + Number(e.salary).toLocaleString() : '-'}</td>
                    <td>${formatDate(e.offer_time)}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editEmployment(${e.employment_id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteEmployment(${e.employment_id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function prevPage() {
            if (paginationData.pageNum > 1) {
                loadEmployments(paginationData.pageNum - 1);
            }
        }

        function nextPage() {
            const totalPages = Math.max(1, Math.ceil(paginationData.total / paginationData.pageSize) || 1);
            if (paginationData.pageNum < totalPages) {
                loadEmployments(paginationData.pageNum + 1);
            }
        }

        function jumpToPage() {
            const jumpPage = parseInt(document.getElementById('jumpPage').value);
            if (jumpPage) {
                goToPage(jumpPage);
            }
        }

        async function searchEmployment() {
            const key = document.getElementById('searchKey').value;
            const value = document.getElementById('searchValue').value;

            if (!value) {
                loadEmployments(1);
                return;
            }

            try {
                const url = `/employment/page?key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}&page=1&size=${paginationData.pageSize}`;
                const response = await fetch(url, { credentials: 'include' });
                const result = await response.json();

                if (result.status_code === 200) {
                    const data = result.data || [];
                    paginationData.total = data.length;
                    paginationData.data = data;
                    paginationData.pageNum = 1;
                    renderEmployments(data);
                    updatePagination();
                } else {
                    renderEmployments([]);
                    document.getElementById('totalRecords').textContent = 0;
                    document.getElementById('totalPages').textContent = 1;
                }
            } catch (error) {
                console.error('Search error:', error);
                renderEmployments([]);
            }
        }

        async function addEmployment() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            // 转换数值为正确的类型
            data.student_id = parseInt(data.student_id) || 0;
            data.class_id = parseInt(data.class_id) || 0;
            data.salary = parseFloat(data.salary) || 0;

            console.log('发送数据:', JSON.stringify(data, null, 2));

            try {
                const response = await fetch('/employment/add', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                console.log('响应结果:', result);

                if (result.status_code === 200) {
                    showAlert('添加成功');
                    closeModal('addModal');
                    clearForm('addForm');
                    loadEmployments(paginationData.pageNum);
                } else {
                    showAlert(result.detail || result.message || '添加失败', 'error');
                }
            } catch (error) {
                console.error('Add error:', error);
                showAlert('添加失败: ' + error.message, 'error');
            }
        }

        async function editEmployment(id) {
            try {
                const url = `/employment/page?key=${encodeURIComponent('全部')}&page=1&size=100`;
                const response = await fetch(url, { credentials: 'include' });
                const result = await response.json();
                const employments = result.data || [];
                const employment = employments.find(e => e.employment_id === id);

                if (employment) {
                    currentEditId = id;
                    document.getElementById('editForm').querySelector('input[name="employment_id"]').value = employment.employment_id;
                    document.getElementById('editForm').querySelector('input[name="student_id"]').value = employment.student_id;
                    document.getElementById('editForm').querySelector('input[name="student_name"]').value = employment.student_name || '';
                    document.getElementById('editForm').querySelector('input[name="class_id"]').value = employment.class_id;
                    document.getElementById('editForm').querySelector('input[name="company"]').value = employment.company || '';
                    document.getElementById('editForm').querySelector('input[name="salary"]').value = employment.salary;
                    document.getElementById('editForm').querySelector('input[name="offer_time"]').value = employment.offer_time?.split('T')[0] || '';
                    openModal('editModal');
                }
            } catch (error) {
                console.error('Edit error:', error);
                showAlert('获取数据失败', 'error');
            }
        }

        async function updateEmployment() {
            const form = document.getElementById('editForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            // 转换数值为正确的类型
            data.student_id = parseInt(data.student_id) || 0;
            data.class_id = parseInt(data.class_id) || 0;
            data.salary = parseFloat(data.salary) || 0;

            try {
                const response = await fetch(`/employment/${currentEditId}`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.status_code === 200) {
                    showAlert('修改成功');
                    closeModal('editModal');
                    clearForm('editForm');
                    loadEmployments(paginationData.pageNum);
                } else {
                    showAlert(result.detail || result.message || '修改失败', 'error');
                }
            } catch (error) {
                console.error('Update error:', error);
                showAlert('修改失败', 'error');
            }
        }

        async function deleteEmployment(id) {
            if (!confirm('确定要删除该就业信息吗？')) return;

            try {
                const response = await fetch(`/employment/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const result = await response.json();

                if (result.status_code === 200) {
                    showAlert('删除成功');
                    loadEmployments(paginationData.pageNum);
                } else {
                    showAlert(result.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('Delete error:', error);
                showAlert('删除失败', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            loadEmployments(1);
        });
    </script>
</body>
</html>
