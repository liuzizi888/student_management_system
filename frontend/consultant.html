<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统 - 顾问管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>学生管理系统</h1>
        <div class="header-right">
            <span>欢迎使用</span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a href="index.html"><span class="nav-icon">🏠</span>首页</a></li>
            <li><a href="student.html"><span class="nav-icon">👨‍🎓</span>学生管理</a></li>
            <li><a href="teacher.html"><span class="nav-icon">👨‍🏫</span>教师管理</a></li>
            <li><a href="class.html"><span class="nav-icon">📚</span>班级管理</a></li>
            <li><a href="score.html"><span class="nav-icon">📝</span>成绩管理</a></li>
            <li><a href="employment.html"><span class="nav-icon">💼</span>就业管理</a></li>
            <li><a href="consultant.html" class="active"><span class="nav-icon">👔</span>顾问管理</a></li>
            <li><a href="department.html"><span class="nav-icon">🏢</span>部门管理</a></li>
            <li><a href="analysis.html"><span class="nav-icon">📊</span>统计分析</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">顾问列表</h2>
                <button class="btn btn-primary" onclick="openModal('addModal')">添加顾问</button>
            </div>
            
            <div class="search-bar">
                <input type="text" id="consultantName" class="form-control" placeholder="顾问姓名" style="max-width: 150px;">
                <button class="btn btn-primary" onclick="loadConsultants()">查询</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>顾问ID</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>所属部门</th>
                        <th>职位</th>
                        <th>联系电话</th>
                        <th>入职日期</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="consultantTable">
                    <tr><td colspan="9" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>

            <div class="pagination">
                <div class="pagination-info">
                    共 <span id="totalRecords">0</span> 条记录，当前第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
                </div>
                <div class="pagination-controls">
                    <button class="btn btn-sm" id="prevPage" onclick="prevPage()">上一页</button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="btn btn-sm" id="nextPage" onclick="nextPage()">下一页</button>
                    <div class="page-jump">
                        跳至 <input type="number" id="jumpPage" class="form-control" min="1" value="1" onkeypress="if(event.key==='Enter') jumpToPage()"> 页
                        <button class="btn btn-sm btn-primary" onclick="jumpToPage()">跳转</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">添加顾问</h3>
                <button class="modal-close" onclick="closeModal('addModal'); clearForm('addForm')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>姓名</label>
                            <input type="text" name="name" class="form-control" required maxlength="20">
                        </div>
                        <div class="form-group">
                            <label>性别</label>
                            <select name="gender" class="form-control" required>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>所属部门</label>
                            <select name="dept_id" id="deptSelect" class="form-control" required>
                                <option value="">请选择部门</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>职位</label>
                            <input type="text" name="position" class="form-control" required maxlength="50">
                        </div>
                        <div class="form-group">
                            <label>联系电话</label>
                            <input type="tel" name="phone" class="form-control" pattern="^1[3-9]\d{9}$">
                        </div>
                        <div class="form-group">
                            <label>入职日期</label>
                            <input type="date" name="entry_date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control" required>
                                <option value="1">在职</option>
                                <option value="0">离职</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea name="remark" class="form-control" required maxlength="255"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('addModal'); clearForm('addForm')">取消</button>
                <button class="btn btn-primary" onclick="addConsultant()">确定</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">修改顾问</h3>
                <button class="modal-close" onclick="closeModal('editModal'); clearForm('editForm')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" name="id">
                    <div class="form-row">
                        <div class="form-group">
                            <label>姓名</label>
                            <input type="text" name="name" class="form-control" required maxlength="20">
                        </div>
                        <div class="form-group">
                            <label>性别</label>
                            <select name="gender" class="form-control" required>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>所属部门</label>
                            <select name="dept_id" id="deptSelectEdit" class="form-control" required>
                                <option value="">请选择部门</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>职位</label>
                            <input type="text" name="position" class="form-control" required maxlength="50">
                        </div>
                        <div class="form-group">
                            <label>联系电话</label>
                            <input type="tel" name="phone" class="form-control" pattern="^1[3-9]\d{9}$">
                        </div>
                        <div class="form-group">
                            <label>入职日期</label>
                            <input type="date" name="entry_date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="status" class="form-control" required>
                                <option value="1">在职</option>
                                <option value="0">离职</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>备注</label>
                            <textarea name="remark" class="form-control" required maxlength="255"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('editModal'); clearForm('editForm')">取消</button>
                <button class="btn btn-primary" onclick="updateConsultant()">确定</button>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        let currentEditId = null;
        let paginationData = {
            pageSize: 10,
            pageNum: 1,
            total: 0,
            data: []
        };

        // 加载部门列表
        async function loadDepartments() {
            try {
                const response = await request('/department/page/100/1');
                const result = response.data.data || {};
                const departments = result.data || [];
                
                // 填充添加表单的部门选择框
                const deptSelect = document.getElementById('deptSelect');
                departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.department_id;
                    option.textContent = dept.dept_name;
                    deptSelect.appendChild(option);
                });
                
                // 填充编辑表单的部门选择框
                const deptSelectEdit = document.getElementById('deptSelectEdit');
                departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.department_id;
                    option.textContent = dept.dept_name;
                    deptSelectEdit.appendChild(option);
                });
            } catch (error) {
                console.error('加载部门列表失败:', error);
            }
        }

        async function loadConsultants(pageNum = 1) {
            const pageSize = 10;
            const consultantName = document.getElementById('consultantName').value.trim();
            paginationData.pageSize = pageSize;
            paginationData.pageNum = pageNum;

            let url = `/consultant/page/${pageSize}/${pageNum}`;
            if (consultantName) {
                url += `?consultant_name=${encodeURIComponent(consultantName)}`;
            }

            try {
                const response = await request(url);
                if (response.data.status_code === 200) {
                    const result = response.data.data || {};
                    paginationData.total = result.total || 0;
                    paginationData.data = result.data || [];
                    renderConsultants(paginationData.data);
                    updatePagination();
                } else {
                    document.getElementById('consultantTable').innerHTML = '<tr><td colspan="9" class="empty-state">加载失败</td></tr>';
                }
            } catch (error) {
                console.error('Load consultants error:', error);
                document.getElementById('consultantTable').innerHTML = '<tr><td colspan="9" class="empty-state">加载失败</td></tr>';
            }
        }

        function renderConsultants(consultants) {
            const tbody = document.getElementById('consultantTable');
            if (!consultants || consultants.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-state">暂无顾问数据</td></tr>';
                return;
            }

            tbody.innerHTML = consultants.map(c => `
                <tr>
                    <td>${c.consultant_id || '-'}</td>
                    <td>${c.name || '-'}</td>
                    <td>${c.gender || '-'}</td>
                    <td>${c.dept_id || '-'}</td>
                    <td>${c.position || '-'}</td>
                    <td>${c.phone || '-'}</td>
                    <td>${formatDate(c.entry_date) || '-'}</td>
                    <td>${c.status === 1 ? '在职' : '离职'}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editConsultant(${c.consultant_id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteConsultant(${c.consultant_id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function updatePagination() {
            const totalPages = Math.ceil(paginationData.total / paginationData.pageSize) || 1;

            document.getElementById('totalRecords').textContent = paginationData.total;
            document.getElementById('currentPage').textContent = paginationData.pageNum;
            document.getElementById('totalPages').textContent = totalPages;
            document.getElementById('jumpPage').max = totalPages;
            document.getElementById('jumpPage').value = paginationData.pageNum;

            document.getElementById('prevPage').disabled = paginationData.pageNum <= 1;
            document.getElementById('nextPage').disabled = paginationData.pageNum >= totalPages;

            renderPageNumbers(totalPages);
        }

        function renderPageNumbers(totalPages) {
            const container = document.getElementById('pageNumbers');
            const current = paginationData.pageNum;
            let html = '';

            const maxVisible = 5;
            let start = Math.max(1, current - Math.floor(maxVisible / 2));
            let end = Math.min(totalPages, start + maxVisible - 1);

            if (end - start < maxVisible - 1) {
                start = Math.max(1, end - maxVisible + 1);
            }

            if (start > 1) {
                html += `<button class="btn btn-sm page-num" onclick="goToPage(1)">1</button>`;
                if (start > 2) {
                    html += `<span class="page-ellipsis">...</span>`;
                }
            }

            for (let i = start; i <= end; i++) {
                const active = i === current ? 'active' : '';
                html += `<button class="btn btn-sm page-num ${active}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (end < totalPages) {
                if (end < totalPages - 1) {
                    html += `<span class="page-ellipsis">...</span>`;
                }
                html += `<button class="btn btn-sm page-num" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            container.innerHTML = html;
        }

        function goToPage(pageNum) {
            const totalPages = Math.ceil(paginationData.total / paginationData.pageSize) || 1;
            pageNum = Math.max(1, Math.min(pageNum, totalPages));
            loadConsultants(pageNum);
        }

        function prevPage() {
            if (paginationData.pageNum > 1) {
                loadConsultants(paginationData.pageNum - 1);
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(paginationData.total / paginationData.pageSize) || 1;
            if (paginationData.pageNum < totalPages) {
                loadConsultants(paginationData.pageNum + 1);
            }
        }

        function jumpToPage() {
            const jumpPage = parseInt(document.getElementById('jumpPage').value);
            if (jumpPage) {
                goToPage(jumpPage);
            }
        }

        async function addConsultant() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            data.dept_id = parseInt(data.dept_id);
            data.status = parseInt(data.status);
            // entry_date 保持原格式即可
            
            try {
                const response = await request('/consultant/add', {
                    method: 'POST',
                    body: data
                });
                
                if (response.data.status_code === 200) {
                    showAlert('添加成功');
                    closeModal('addModal');
                    clearForm('addForm');
                    loadConsultants();
                } else {
                    showAlert(response.data.message || '添加失败', 'error');
                }
            } catch (error) {
                console.error('Add error:', error);
                showAlert('添加失败', 'error');
            }
        }

        async function editConsultant(id) {
            currentEditId = id;
            try {
                const response = await request(`/consultant/page/100/1`);
                const result = response.data.data || {};
                const consultants = result.data || [];
                const consultant = consultants.find(c => c.consultant_id === id);
                
                if (consultant) {
                    document.getElementById('editForm').querySelector('input[name="id"]').value = consultant.consultant_id;
                    document.getElementById('editForm').querySelector('input[name="name"]').value = consultant.name || '';
                    document.getElementById('editForm').querySelector('select[name="gender"]').value = consultant.gender || '男';
                    document.getElementById('editForm').querySelector('select[name="dept_id"]').value = consultant.dept_id || '';
                    document.getElementById('editForm').querySelector('input[name="position"]').value = consultant.position || '';
                    document.getElementById('editForm').querySelector('input[name="phone"]').value = consultant.phone || '';
                    document.getElementById('editForm').querySelector('input[name="entry_date"]').value = consultant.entry_date?.split('T')[0] || '';
                    document.getElementById('editForm').querySelector('select[name="status"]').value = consultant.status || 1;
                    document.getElementById('editForm').querySelector('textarea[name="remark"]').value = consultant.remark || '';
                    openModal('editModal');
                }
            } catch (error) {
                console.error('Edit error:', error);
                showAlert('获取数据失败', 'error');
            }
        }

        async function updateConsultant() {
            const form = document.getElementById('editForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            data.dept_id = parseInt(data.dept_id);
            data.status = parseInt(data.status);
            // entry_date 保持原格式即可
            
            try {
                const response = await request(`/consultant/update?consultant_id=${currentEditId}`, {
                    method: 'PUT',
                    body: data
                });
                
                if (response.data.status_code === 200) {
                    showAlert('修改成功');
                    closeModal('editModal');
                    clearForm('editForm');
                    loadConsultants();
                } else {
                    showAlert(response.data.message || '修改失败', 'error');
                }
            } catch (error) {
                console.error('Update error:', error);
                showAlert('修改失败', 'error');
            }
        }

        async function deleteConsultant(id) {
            if (!confirm('确定要删除这条顾问信息吗？')) return;
            
            try {
                const response = await request(`/consultant/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.data.status_code === 200) {
                    showAlert('删除成功');
                    loadConsultants();
                } else {
                    showAlert(response.data.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('Delete error:', error);
                showAlert('删除失败', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            loadDepartments();
            loadConsultants(1);
        });
    </script>
</body>
</html>
