<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理系统 - 学生管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>学生管理系统</h1>
        <div class="header-right">
            <span>欢迎使用</span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="sidebar">
        <ul>
            <li><a href="index.html"><span class="nav-icon">🏠</span>首页</a></li>
            <li><a href="student.html" class="active"><span class="nav-icon">👨‍🎓</span>学生管理</a></li>
            <li><a href="teacher.html"><span class="nav-icon">👨‍🏫</span>教师管理</a></li>
            <li><a href="class.html"><span class="nav-icon">📚</span>班级管理</a></li>
            <li><a href="score.html"><span class="nav-icon">📝</span>成绩管理</a></li>
            <li><a href="employment.html"><span class="nav-icon">💼</span>就业管理</a></li>
            <li><a href="consultant.html"><span class="nav-icon">👔</span>顾问管理</a></li>
            <li><a href="department.html"><span class="nav-icon">🏢</span>部门管理</a></li>
            <li><a href="analysis.html"><span class="nav-icon">📊</span>统计分析</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">学生列表</h2>
                <button class="btn btn-primary" onclick="openModal('addModal')">添加学生</button>
            </div>
            
            <div class="search-bar">
                <select id="searchKey" class="form-control" style="max-width: 120px;">
                    <option value="编号">编号</option>
                    <option value="姓名">姓名</option>
                    <option value="班级">班级</option>
                </select>
                <input type="text" id="searchValue" class="form-control" placeholder="搜索关键词">
                <button class="btn btn-primary" onclick="searchStudents()">搜索</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>学生编号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>年龄</th>
                        <th>班级</th>
                        <th>专业</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <tr><td colspan="7" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">添加学生</h3>
                <button class="modal-close" onclick="closeModal('addModal'); clearForm('addForm')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>学生编号</label>
                            <input type="text" name="student_id" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>姓名</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>性别</label>
                            <select name="gender" class="form-control" required>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>年龄</label>
                            <input type="number" name="age" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>班级名称</label>
                            <input type="text" name="class_name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>专业</label>
                            <input type="text" name="major" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('addModal'); clearForm('addForm')">取消</button>
                <button class="btn btn-primary" onclick="addStudent()">确定</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">修改学生</h3>
                <button class="modal-close" onclick="closeModal('editModal'); clearForm('editForm')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" name="id">
                    <div class="form-row">
                        <div class="form-group">
                            <label>学生编号</label>
                            <input type="text" name="student_id" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>姓名</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>性别</label>
                            <select name="gender" class="form-control" required>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>年龄</label>
                            <input type="number" name="age" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>班级名称</label>
                            <input type="text" name="class_name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>专业</label>
                            <input type="text" name="major" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('editModal'); clearForm('editForm')">取消</button>
                <button class="btn btn-primary" onclick="updateStudent()">确定</button>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        let currentEditId = null;

        async function loadStudents() {
            try {
                const response = await request('/student/students?key=姓名&value=');
                const students = response.data.data || [];
                renderStudents(students);
            } catch (error) {
                console.error('Load students error:', error);
                document.getElementById('studentTable').innerHTML = '<tr><td colspan="7" class="empty-state">加载失败</td></tr>';
            }
        }

        function renderStudents(students) {
            const tbody = document.getElementById('studentTable');
            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无学生数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = students.map(s => `
                <tr>
                    <td>${s.student_id || '-'}</td>
                    <td>${s.name || '-'}</td>
                    <td>${s.gender || '-'}</td>
                    <td>${s.age || '-'}</td>
                    <td>${s.class_name || '-'}</td>
                    <td>${s.major || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editStudent(${s.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteStudent(${s.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function searchStudents() {
            const key = document.getElementById('searchKey').value;
            const value = document.getElementById('searchValue').value;
            
            try {
                const response = await request(`/student/students?key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`);
                if (response.data.status_code === 200) {
                    renderStudents(response.data.data || []);
                } else {
                    renderStudents([]);
                }
            } catch (error) {
                console.error('Search error:', error);
                renderStudents([]);
            }
        }

        async function addStudent() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await request('/student/students', {
                    method: 'POST',
                    body: data
                });
                
                if (response.data.status_code === 200) {
                    showAlert('添加成功');
                    closeModal('addModal');
                    clearForm('addForm');
                    loadStudents();
                } else {
                    showAlert(response.data.message || '添加失败', 'error');
                }
            } catch (error) {
                console.error('Add error:', error);
                showAlert('添加失败', 'error');
            }
        }

        async function editStudent(id) {
            try {
                const response = await request('/student/students?key=编号&value=' + id);
                const student = response.data.data?.[0];
                if (student) {
                    currentEditId = student.id;
                    document.getElementById('editForm').querySelector('input[name="id"]').value = student.id;
                    document.getElementById('editForm').querySelector('input[name="student_id"]').value = student.student_id;
                    document.getElementById('editForm').querySelector('input[name="name"]').value = student.name;
                    document.getElementById('editForm').querySelector('select[name="gender"]').value = student.gender;
                    document.getElementById('editForm').querySelector('input[name="age"]').value = student.age;
                    document.getElementById('editForm').querySelector('input[name="class_name"]').value = student.class_name;
                    document.getElementById('editForm').querySelector('input[name="major"]').value = student.major;
                    openModal('editModal');
                }
            } catch (error) {
                console.error('Edit error:', error);
                showAlert('获取数据失败', 'error');
            }
        }

        async function updateStudent() {
            const form = document.getElementById('editForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await request(`/student/students/${currentEditId}`, {
                    method: 'PUT',
                    body: data
                });
                
                if (response.data.status_code === 200) {
                    showAlert('修改成功');
                    closeModal('editModal');
                    clearForm('editForm');
                    loadStudents();
                } else {
                    showAlert(response.data.message || '修改失败', 'error');
                }
            } catch (error) {
                console.error('Update error:', error);
                showAlert('修改失败', 'error');
            }
        }

        async function deleteStudent(id) {
            if (!confirm('确定要删除该学生吗？')) return;
            
            try {
                const response = await request(`/student/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.data.status_code === 200) {
                    showAlert('删除成功');
                    loadStudents();
                } else {
                    showAlert(response.data.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('Delete error:', error);
                showAlert('删除失败', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            loadStudents();
        });
    </script>
</body>
</html>
